version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Appointment Booking System — Full Stack
#
# Services:
#   postgres  — PostgreSQL 16 database
#   backend   — Java 17 Spring Boot API    (port 5000)
#   frontend  — React SPA via Nginx        (port 3000)
#
# Usage:
#   docker compose up --build          # build and start all services
#   docker compose up -d               # run in background
#   docker compose down -v             # stop and remove volumes
#   docker compose logs -f backend     # stream backend logs
#   docker compose exec backend sh     # shell into backend container
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: appt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       appointment_booking
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_booking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network


  # ─── Java 17 Spring Boot Backend ───────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
      target:     production
    container_name: appt_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod

      # Database (Hikari)
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        appointment_booking
      DB_USER:        postgres
      DB_PASSWORD:    ${DB_PASSWORD:-postgres}
      DB_POOL_MAX:    20
      DB_POOL_MIN:    5

      # Security — OVERRIDE in production via secrets manager
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-32charEncryptionKeyForAES256!!!X}

      # Email — leave blank for Ethereal (simulated) confirmation
      SMTP_HOST:       ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER:-}
      SMTP_PASS:       ${SMTP_PASS:-}
      EMAIL_FROM:      ${EMAIL_FROM:-noreply@appointmentbooking.co.za}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Appointment Booking System}

      # CORS
      CORS_ORIGIN: http://localhost:3000

      # Server
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Spring Boot needs ~30-60s to start
    networks:
      - app_network


  # ─── React + Nginx Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      target:     production
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: appt_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network


# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local


# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
