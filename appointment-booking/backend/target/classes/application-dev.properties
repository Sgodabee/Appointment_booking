spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:appointment_booking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:M@goda}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=AppointmentHikariPool

spring.jpa.show-sql=true

# ── Mail: Gmail SMTP (development) ────────────────────────────────────────────
# Credentials come from environment variables — NEVER commit them.
#   SMTP_USER = your full Gmail address (e.g. you@gmail.com)
#   SMTP_PASS = a Google App Password (16 chars, requires 2-Step Verification)
# Gmail rewrites/enforces the From header to the authenticated account. If
# EMAIL_FROM is not set, EmailService falls back to the SMTP username.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.email.from=${EMAIL_FROM:vutivim92@gmail.com}

# Allow any localhost port during development (e.g. 3000, 3001, 5173)
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*}

logging.level.root=INFO
logging.level.com.appointmentbooking=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
