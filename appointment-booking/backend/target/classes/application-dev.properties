spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:appointment_booking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:M@goda}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=AppointmentHikariPool

spring.jpa.show-sql=true

# Allow any localhost port during development (e.g. 3000, 3001, 5173)
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*}

logging.level.root=INFO
logging.level.com.appointmentbooking=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
