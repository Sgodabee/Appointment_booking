spring.application.name=appointment-booking-backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── JPA ──────────────────────────────────────────────────────────────────────
# Flyway owns the schema — never let Hibernate alter it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Prevent lazy-loading outside transactions
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

# ── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.debug=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:5000}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024
# Never expose exception messages in /error
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ── OpenAPI / Swagger UI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ── App custom properties ────────────────────────────────────────────────────
app.api-version=v1
app.encryption.key=${ENCRYPTION_KEY:32charEncryptionKeyForAES256!!!X}
app.email.from=${EMAIL_FROM:noreply@appointmentbooking.co.za}
app.email.from-name=${EMAIL_FROM_NAME:Appointment Booking System}
app.rate-limit.booking-max=10
app.rate-limit.booking-window-min=60
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:3000}

# ── JWT
# Override JWT_SECRET with a strong Base64-encoded 256-bit key in production.
app.jwt.secret=${JWT_SECRET:Y2hhbmdlbWVpbnByb2R1Y3Rpb25rZXkxMjM0NTY3ODk=}
app.jwt.employee-expiry-seconds=${JWT_EMPLOYEE_EXPIRY:28800}
app.jwt.customer-expiry-seconds=${JWT_CUSTOMER_EXPIRY:3600}


app.timezone=${APP_TIMEZONE:Africa/Johannesburg}

app.reminder.check-interval-ms=${REMINDER_INTERVAL_MS:300000}
app.reminder.initial-delay-ms=${REMINDER_INITIAL_DELAY_MS:60000}
